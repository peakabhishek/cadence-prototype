/* === handoff/tokens.css (approved Windowsill tokens, unchanged) === */
/* Cadence design tokens — Direction A “Windowsill”, 16 Nov 2026
   Canonical names match tokens-a.css and the Cadence laptop sources
   (src/cadence_laptop.py, src/cadence_states.py, src/extra.py LAP_CSS,
   src/screens.py BASE_A, src/money_plant.py).
   All text pairs: contrast.md. Terracotta and --sun are never used for text.
   --wither-leaf is illustration only; withered text uses --wither-ink. */

:root {
  /* -------------------------------------------------
     Colour — primary
     ------------------------------------------------- */
  --leaf: #1B5E3B;          /* primary actions, “Grew”, selected fills, progress */
  --leaf-deep: #0F3D27;     /* wordmark, timers, hero numbers, outline labels */
  --leaf-wash: #E6EEE3;     /* selected cards, active tabs, notification banner */
  --on-leaf: #F7F0E6;       /* text on --leaf (6.85:1) */
  --success: #1B5E3B;       /* alias of --leaf */

  /* Colour — accent (decorative only; never text) */
  --terracotta: #C45C2A;    /* pots only */
  --sun: #F6D9A8;           /* morning-light glow only */

  /* Colour — neutrals */
  --bg: #F7F0E6;            /* warm plaster */
  --surface: #FFFBF6;       /* cards, fields, dialogs, outline buttons */
  --text: #2A2118;
  --text-muted: #5C5146;    /* captions, placeholders, secondary meta */
  --line: #E6D7C4;
  --track: #EFE4D5;         /* progress tracks, tags, skeleton bars, empty wells */
  --chrome: #EFE6DA;        /* window chrome bar */
  --chrome-line: #E0D2BF;
  --url-bg: #FBF6EF;        /* URL bar and “Install Cadence” pill */
  --sill-top: #EADBC7;
  --sill-bot: #E1CFB8;
  --sill-edge: #D6C2A8;
  --glow-wash: #F9F3EA;     /* top of the morning-light gradient */

  /* Colour — semantic */
  --wither-ink: #74492B;    /* withered label text, “Gave up”, shortfall copy */
  --wither-bg: #F3E6D6;     /* withered page + save-failed alert */
  --wither-leaf: #8B5E3C;   /* illustration + large outcome marks only, never small text */
  --shortfall: #B98A62;     /* dashed gap / unmet top border (not text) */
  --short-card: #FBF4EC;    /* unmet weekly goal card */
  --short-card-line: #E5CFB6;
  --short-badge-line: #D9BFA2;
  --reason-chip: #E7D6C4;   /* “You gave up.” reason chip */
  --wither-chrome: #ECDDCB;
  --wither-light: #F6EBDD;
  --radio-idle: #B9A790;    /* unselected goal-card radio */
  --scrim: rgba(42, 33, 24, 0.38);

  /* Colour — plant (illustration only, from src/money_plant.py) */
  --soil: #5C3D2E;
  --plant-leaf-1: #2F7148;
  --plant-leaf-2: #3A8052;
  --plant-leaf-3: #2A6842;
  --plant-leaf-4: #357A4D;
  --plant-leaf-5: #44875A;
  --plant-young-1: #5E9A5C;
  --plant-young-2: #6AA466;
  --plant-young-3: #579457;
  --plant-stem: #5C8A50;
  --plant-dry-1: #B39566;
  --plant-dry-2: #A99A5A;
  --plant-dry-3: #BFA071;
  --plant-dry-4: #9C7A4A;
  --plant-dry-5: #B2A068;
  --plant-dry-6: #AE8F5C;
  --plant-dry-stem: #8A6D45;
  --window-light-1: #E3B5A0;
  --window-light-2: #E6CF9E;
  --window-light-3: #B9CDAF;

  /* -------------------------------------------------
     Type
     Display: Fraunces, opsz auto, SOFT 50–100.
     UI: Source Sans 3, 400/500/600/700.
     ------------------------------------------------- */
  --font-display: "Fraunces", Georgia, serif;
  --font-ui: "Source Sans 3", system-ui, sans-serif;

  /* Base scale (tokens-a.css; also used on phone) */
  --fs-wordmark: 20px;
  --fs-title: 32px;          /* 28–34 */
  --fs-timer: 76px;          /* 64–80, tabular-nums */
  --fs-hero-number: 64px;
  --fs-body: 17px;
  --fs-caption: 13px;
  --fs-button: 17px;
  --lh-body: 1.45;

  /* Laptop scale (sizes actually used in the Cadence laptop sources) */
  --fs-wordmark-laptop: 27px;
  --fs-title-laptop: 44px;   /* L0 / L1 morning */
  --fs-title-grove: 40px;    /* L7 */
  --fs-title-sheet: 34px;    /* L2, goal name on a live session */
  --fs-end-title: 52px;      /* L5 / L6 / E3 */
  --fs-timer-laptop: 120px;
  --fs-hero-laptop: 84px;    /* L8 hero */
  --fs-tally-laptop: 60px;   /* L7 “1h 40m” / “0m” */
  --fs-dialog-title: 32px;
  --fs-banner-title: 16px;
  --fs-banner-body: 14.5px;
  --fs-badge: 14.5px;
  --fs-label: 13px;
  --fs-nav: 15px;

  /* -------------------------------------------------
     Spacing (base 8)
     ------------------------------------------------- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 40px;
  --s-8: 48px;
  --s-page: 64px;            /* laptop content inset */
  --s-panel: 40px;           /* large panel padding */
  --s-card: 22px;

  /* Radius */
  --r-input: 12px;
  --r-card: 16px;
  --r-sheet: 24px;
  --r-pill: 999px;
  --r-chrome: 8px;           /* URL bar */

  /* Shadow */
  --shadow-card: 0 1px 0 rgba(92, 61, 46, 0.06), 0 8px 24px -12px rgba(92, 61, 46, 0.18);
  --shadow-sheet: 0 1px 0 rgba(92, 61, 46, 0.06), 0 30px 60px -24px rgba(92, 61, 46, 0.35);
  --shadow-dialog: 0 1px 0 rgba(92, 61, 46, 0.06), 0 28px 64px -16px rgba(42, 33, 24, 0.48);
  --shadow-primary: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 22px -12px rgba(15, 61, 39, 0.7);

  /* Sizing */
  --tap-min: 44px;
  --button-h: 56px;
  --button-h-laptop: 58px;   /* L0 / L1 primary; L2 start is 60px */
  --field-h: 56px;
  --nav-h: 40px;             /* laptop tab height */
  --chrome-h: 46px;
  --icon-stroke: 1.75px;
  --time-box-w: 104px;       /* laptop goal-row time box */
}

/* === ios-tokens.css (provisional iOS extension, unchanged) === */
/* Cadence for iPhone — Option B “Windowsill, native iOS” tokens (cadence#54)
   PROVISIONAL until Abhishek approves the iPhone visual direction.
   Iris (Design), 26 Nov 2026.

   This file EXTENDS the approved Windowsill tokens; it does not fork them.
   Load order:
     1. tokens.css   (handoff/tokens.css = cadence web/tokens.css, unchanged)
     2. ios-tokens.css (this file)
   Every colour below is either a var() reference to tokens.css or a new
   --ios-* / --banner-* token. Nothing in tokens.css is redefined, so the Mac
   web app is untouched. Contrast results: contrast.md (option B section).

   Works the same in a Capacitor wrapper and in native Swift (map each token
   to an asset-catalog colour / UIFont text style there). Where the two build
   paths differ, see component-specs-ios.md § “Capacitor vs Swift”. */

:root {
  /* ---------- Colour: roles (all from tokens.css) ---------- */
  --ios-tint: var(--leaf);                 /* #1B5E3B buttons, links, selected tab, ticks */
  --ios-tint-strong: var(--leaf-deep);     /* #0F3D27 timer, hero numbers */
  --ios-on-tint: var(--on-leaf);           /* #F7F0E6 on --ios-tint, 6.85:1 */
  --ios-tint-wash: var(--leaf-wash);       /* #E6EEE3 selected rows, info banner, toolbar circle */
  --ios-bg: var(--bg);                     /* #F7F0E6 grouped background */
  --ios-cell: var(--surface);              /* #FFFBF6 inset grouped cells, sheets */
  --ios-label: var(--text);                /* #2A2118 primary label */
  --ios-label-2: var(--text-muted);        /* #5C5146 secondary label, placeholder, inactive tab (7.7:1 on cell) */
  --ios-separator: var(--line);            /* #E6D7C4 hairlines (decorative) */
  --ios-fill: var(--track);                /* #EFE4D5 progress track, skeleton, chips */
  --ios-warn-ink: var(--wither-ink);       /* #74492B sync failed, conflict, Give up, sign-in expired */
  --ios-warn-bg: var(--wither-bg);         /* #F3E6D6 */
  --ios-pot: var(--terracotta);            /* illustration only, never text */
  --ios-glow: var(--sun);                  /* illustration only, never text */
  --ios-scrim: var(--scrim);

  /* New iOS-only surfaces */
  --ios-tabbar-bg: rgba(255, 251, 246, 0.92);  /* --surface at 92% + blur(20px) */
  --ios-tabbar-blur: 20px;
  --ios-grabber: var(--line);
  --ios-sheet-bg: var(--surface);
  --ios-plant-card: linear-gradient(180deg, #FBF4EA 0%, #F5E3C6 100%); /* glow-wash -> sun, decorative */

  /* Demo-mode banner (Steve’s product rule). Shown only while the mock
     storage adapter is active; same config flag. Not dismissible.
     Text on background: 7.52:1 (AA). */
  --banner-demo-bg: #F6D9A8;      /* same value as --sun */
  --banner-demo-text: #5A3A12;
  --banner-demo-h: 24px;
  --banner-demo: var(--banner-demo-bg);   /* shorthand alias asked for in the brief */

  /* ---------- Type: system font stack + iOS text styles ----------
     UI text uses the system font (SF Pro on iPhone). In a Capacitor WKWebView,
     the `font: -apple-system-&lt;style&gt;` keywords follow Dynamic Type; the px values
     are the default (“Large”) size and the fallback. Fraunces (self-hosted,
     web/fonts) stays for the timer and the end-screen title only. */
  --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", sans-serif;
  --ios-font-rounded: ui-rounded, -apple-system, system-ui, sans-serif;
  --ios-font-display: var(--font-display);  /* Fraunces */

  /*                size / line-height / weight      Dynamic Type style     */
  --ios-large-title: 700 34px/41px var(--ios-font);  /* .largeTitle  (screen titles: Today) */
  --ios-title1: 700 28px/34px var(--ios-font);       /* .title1      (sheet titles) */
  --ios-title2: 700 22px/28px var(--ios-font);       /* .title2      (plant-card tally) */
  --ios-title3: 600 20px/25px var(--ios-font);       /* .title3      (alert titles) */
  --ios-headline: 600 17px/22px var(--ios-font);     /* .headline    (buttons, nav title) */
  --ios-body: 400 17px/22px var(--ios-font);         /* .body        (goal rows, fields) */
  --ios-callout: 400 16px/21px var(--ios-font);      /* .callout     (banner body) */
  --ios-subhead: 400 15px/20px var(--ios-font);      /* .subheadline (row detail: 30 / 45 min) */
  --ios-footnote: 400 13px/18px var(--ios-font);     /* .footnote    (section headers, sync status, hints) */
  --ios-caption1: 400 12px/16px var(--ios-font);     /* .caption1 */
  --ios-caption2: 500 11px/13px var(--ios-font);     /* .caption2    (tab labels, 10.5–11px) */
  --ios-timer: 600 76px/1 var(--ios-font-display);   /* custom, scales with .largeTitle; tabular-nums */
  --ios-end-title: 600 34px/1.1 var(--ios-font-display);
  --ios-tracking-tight: -0.02em;                     /* large title / title1 */

  /* ---------- Spacing (base 8 from tokens.css, plus iOS margins) ---------- */
  --ios-margin: 16px;            /* inset grouped side margin = --s-4 */
  --ios-cell-pad-x: 16px;
  --ios-cell-min-h: 50px;        /* ≥ --tap-min (44px) */
  --ios-separator-inset: 52px;   /* hairline starts after the tick */
  --ios-section-gap: 24px;       /* = --s-5 */
  --ios-section-header-pad: 14px 16px 7px;
  --ios-nav-h: 44px;
  --ios-tabbar-h: 49px;          /* + safe-area bottom */
  --ios-button-h: 52px;
  --ios-tick: 24px;

  /* ---------- Radius ---------- */
  --ios-r-cell-group: 12px;      /* inset grouped section */
  --ios-r-button: 14px;          /* filled / tinted buttons */
  --ios-r-sheet: 12px;           /* sheet top corners (system-like) */
  --ios-r-banner: 14px;
  --ios-r-chip: var(--r-pill);
  --ios-r-field: 10px;

  /* ---------- Icons ---------- */
  --ios-icon-stroke: 1.9px;      /* SF Symbols “regular” look; outline when idle, filled when selected */
  --ios-icon-size: 22px;         /* tab bar 24px, inline 16–18px */

  /* ---------- Safe areas (iPhone 390×844 values as fallbacks) ----------
     Capacitor: needs viewport-fit=cover; env() then reports real insets.
     Swift: use safeAreaInsets / .safeAreaInset; these values are reference only. */
  --ios-safe-top: env(safe-area-inset-top, 47px);       /* 54px on Dynamic Island models */
  --ios-safe-bottom: env(safe-area-inset-bottom, 34px); /* home indicator */
  --ios-safe-left: env(safe-area-inset-left, 0px);
  --ios-safe-right: env(safe-area-inset-right, 0px);
  --ios-keyboard-h: 336px;       /* reference only; read the real height at runtime */

  /* ---------- Motion ---------- */
  --ios-sheet-ease: cubic-bezier(0.32, 0.72, 0, 1);
  --ios-sheet-dur: 380ms;
}

/* Dark mode: NOT part of Option B. Until a dark direction is approved the app
   stays light (Capacitor: no prefers-color-scheme rules; Swift:
   UIUserInterfaceStyle = Light). Option C “Night garden” is the candidate. */

</style>
<style id="appcss">
/* Prototype CSS. Colours, radii, spacing and safe areas come from the tokens above.
   Type sizes are rem so they follow Dynamic Type: 1rem = 17px at the default size,
   so 34px = 2rem, 13px = 0.7647rem, and so on (the same sizes as ios-tokens.css). */
html{font-size:17px;font:-apple-system-body;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ios-bg);color:var(--ios-label)}
body{font-family:var(--ios-font);overscroll-behavior:none;overflow:hidden;position:fixed;inset:0;width:100%;
  -webkit-font-smoothing:antialiased;line-height:1.3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
.ic{flex:none;vertical-align:middle}
#stage{position:fixed;inset:0}
#device{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--ios-bg);isolation:isolate}
/* desktop / ?frame=1: a simulated 390x844 phone with status bar, island, home indicator */
html.wide body{background:var(--text)}
html.wide #device{inset:auto;left:50%;top:50%;width:390px;height:844px;margin:-422px 0 0 -195px;border-radius:48px;box-shadow:0 0 0 9px var(--text),0 0 0 11px var(--text-muted),0 30px 60px -20px var(--scrim);transform-origin:50% 50%}
html.sim{--ios-safe-top:54px;--ios-safe-bottom:34px}
.sim-only{display:none}
html.sim .sim-only{display:block}
.simsb{position:absolute;top:0;left:0;right:0;height:54px;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 46px;font-weight:600;font-size:1.0000rem;color:var(--ios-label);pointer-events:none;letter-spacing:-0.02em}
.simsb .r{display:flex;gap:6px;align-items:center}
.simisland{position:absolute;top:11px;left:50%;margin-left:-63px;width:126px;height:37px;border-radius:20px;background:var(--text);z-index:90;pointer-events:none}
.simhome{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--text);z-index:90;pointer-events:none}

/* top: safe area, then the demo banner (every screen) */
.safe-top{height:var(--ios-safe-top);flex:none;background:var(--ios-bg)}
.demo{flex:none;height:var(--banner-demo-h);background:var(--banner-demo);color:var(--banner-demo-text);font-weight:600;font-size:0.7647rem;line-height:var(--banner-demo-h);text-align:center;user-select:none;-webkit-user-select:none;position:relative;z-index:70}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.nav{height:var(--ios-nav-h);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--ios-margin) - 8px) 0 calc(var(--ios-margin) - 8px)}
.nav .mid{font-weight:600;font-size:1.0000rem;position:absolute;left:50%;transform:translateX(-50%)}
.navbtn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ios-tint);font-size:1.0000rem;gap:2px}
.navbtn.dots{color:var(--ios-label-2);opacity:.7}
.navbtn.back{justify-content:flex-start;padding-left:4px;font-weight:500}
.circ{width:32px;height:32px;border-radius:50%;background:var(--ios-tint-wash);color:var(--ios-tint);display:flex;align-items:center;justify-content:center}
.lt{padding:0 var(--ios-margin);flex:none}
.lt h1{font-size:2.0000rem;line-height:1.2;font-weight:700;letter-spacing:var(--ios-tracking-tight)}
.sub{font-size:0.8824rem;color:var(--ios-label-2);margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.status{display:inline-flex;align-items:flex-start;gap:6px;padding:12px 6px;margin:-12px -6px;color:var(--ios-label-2);font-size:0.7647rem;line-height:1.35;text-align:left;min-height:44px;align-items:center}
.status.warn{color:var(--ios-warn-ink)}
.status.own{display:flex;width:100%;margin-top:-6px}
.tzh{display:flex;gap:4px;align-items:center;font-size:0.7353rem;font-weight:600;color:var(--ios-label-2);margin-top:2px;width:100%}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px var(--ios-margin) 16px}
.stack{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.sec{font-size:0.7647rem;color:var(--ios-label-2);text-transform:uppercase;letter-spacing:.02em;padding:14px 16px 7px;display:flex;justify-content:space-between}
.grp{background:var(--ios-cell);border-radius:var(--ios-r-cell-group);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:var(--ios-cell-min-h);padding:0 var(--ios-cell-pad-x);font-size:1.0000rem;position:relative;background:var(--ios-cell);width:100%}
.swipe{position:relative;overflow:hidden}
.swipe+.swipe::before,.grp>.row+.row::before{content:"";position:absolute;top:0;left:var(--ios-separator-inset);right:0;border-top:1px solid var(--ios-separator);z-index:2;pointer-events:none}
.swipe .rm{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--ios-warn-bg);color:var(--ios-warn-ink);font-weight:600;font-size:0.8824rem;display:flex;align-items:center;justify-content:center}
.swipe .row{touch-action:pan-y;transition:transform .22s var(--ios-sheet-ease)}
.swipe .row.drag{transition:none}
.tick{width:var(--ios-tick);height:var(--ios-tick);border-radius:50%;border:1.8px solid var(--ios-label-2);display:flex;align-items:center;justify-content:center;flex:none;pointer-events:none;background:transparent;box-shadow:none;-webkit-appearance:none;appearance:none}
.tick.on{background:var(--ios-tint);border-color:var(--ios-tint);color:var(--ios-on-tint);box-shadow:none}
.tick:hover,.tick:active,.tick:focus{background:transparent;border-color:var(--ios-label-2);box-shadow:none}
.tick.on:hover,.tick.on:active,.tick.on:focus{background:var(--ios-tint);border-color:var(--ios-tint);color:var(--ios-on-tint);box-shadow:none}
.row.goal{width:100%}
.row .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bx{font-size:0.8824rem;color:var(--ios-label-2);white-space:nowrap}
.us{color:var(--ios-label-2);margin-left:6px}
.trail{flex:none;color:var(--ios-label-2);display:flex;align-items:center;margin-left:4px}
.v2{font-size:0.7059rem;font-weight:700;color:var(--ios-warn-ink);background:var(--ios-warn-bg);padding:2px 7px;border-radius:var(--ios-r-chip);margin-left:6px}
.row.addrow{color:var(--ios-tint);min-height:var(--ios-cell-min-h)}
.row.addrow .pl{width:24px;display:flex;justify-content:center}
.row.addrow:disabled,.row.addrow[aria-disabled=true]{opacity:.45}
.pk{min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:var(--ios-tint-wash);color:var(--ios-tint-strong);font-weight:600;font-size:0.8824rem}
.pk.off{background:var(--ios-fill);color:var(--ios-label-3,var(--ios-label-2));opacity:.7}
.hint{font-size:0.7647rem;color:var(--ios-label-2);padding:6px 16px 0;line-height:1.35}
.removed{font-size:0.8824rem;color:var(--ios-label-2);padding:10px 4px 0;display:flex;justify-content:space-between;align-items:center}
.removed button{color:var(--ios-tint);font-weight:700;min-height:44px;padding:0 8px;margin:-12px -4px}
.plantcard{display:flex;align-items:flex-end;gap:12px;padding:12px 16px 0;height:120px;background:var(--ios-plant-card);border-radius:var(--ios-r-cell-group);overflow:hidden;margin-bottom:4px;position:relative}
.plantcard img{width:82px;display:block;margin-bottom:-4px}
.plantcard .tx{padding-bottom:16px;font-size:0.8824rem;color:var(--ios-label-2)}
.plantcard .tx b{display:block;font-size:1.2941rem;color:var(--ios-label);font-weight:700;letter-spacing:-.02em}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--ios-r-banner);font-size:0.8824rem;line-height:1.35}
.banner.info{background:var(--ios-tint-wash);color:var(--ios-tint-strong)}
.banner.warn{background:var(--ios-warn-bg);color:var(--ios-warn-ink)}
.banner b{font-weight:700}
.banner .act{margin-left:auto;font-weight:700;white-space:nowrap;align-self:center;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:flex;align-items:center;padding:0 4px;margin-top:-12px;margin-bottom:-12px}
.banner .ic{margin-top:2px}
.foot{flex:none;padding:8px var(--ios-margin)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:var(--ios-button-h);border-radius:var(--ios-r-button);font-weight:600;font-size:1.0000rem;border:0}
.btn.pri{background:var(--ios-tint);color:var(--ios-on-tint)}
.btn.out{background:var(--ios-cell);color:var(--ios-tint-strong);border:1.5px solid var(--ios-separator)}
.btn.txt{background:none;color:var(--ios-tint);height:44px}
.btn:disabled{opacity:.45}
.btn.giveup{color:var(--ios-warn-ink)}
.tabs{flex:none;height:calc(var(--ios-tabbar-h) + var(--ios-safe-bottom));padding-bottom:var(--ios-safe-bottom);background:var(--ios-tabbar-bg);-webkit-backdrop-filter:blur(var(--ios-tabbar-blur));backdrop-filter:blur(var(--ios-tabbar-blur));border-top:1px solid var(--ios-separator);display:flex;justify-content:space-around;position:relative;z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:0.6471rem;font-weight:600;color:var(--ios-label-2);min-height:var(--ios-tabbar-h)}
.tabs button.on{color:var(--ios-tint)}
.runbar{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border-radius:var(--ios-r-button);background:var(--ios-tint-wash);color:var(--ios-tint-strong);padding:0 16px;font-weight:600}
.runbar .t{margin-left:auto;font-variant-numeric:tabular-nums}
.pad-bottom{height:var(--ios-safe-bottom);flex:none}

/* sheets */
.layer{position:absolute;inset:0;z-index:60;pointer-events:none}
.layer>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--ios-scrim);animation:fade .25s ease both}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);top:calc(var(--ios-safe-top) + var(--banner-demo-h) + 14px);background:var(--ios-sheet-bg);border-radius:var(--ios-r-sheet) var(--ios-r-sheet) 0 0;padding:6px var(--ios-margin) 0;display:flex;flex-direction:column;animation:up var(--ios-sheet-dur) var(--ios-sheet-ease) both;overflow:hidden}
.sheet.auto{top:auto;max-height:calc(100% - var(--ios-safe-top) - var(--banner-demo-h) - 14px);padding-bottom:calc(var(--ios-safe-bottom) + 12px)}
.sheet .inner{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ios-grabber);margin:0 auto 8px;flex:none}
.shead{display:flex;justify-content:space-between;align-items:center;height:44px;font-size:1.0000rem;flex:none}
.shead .l,.shead .r{min-width:64px;min-height:44px;display:flex;align-items:center;color:var(--ios-tint)}
.shead .r{justify-content:flex-end;font-weight:700}
.shead .r:disabled{color:var(--ios-label-2);font-weight:700}
.shead b{font-weight:600}
.field{background:var(--ios-bg);border-radius:var(--ios-r-cell-group);overflow:hidden;margin-top:12px}
.field .row{background:var(--ios-bg);min-height:50px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1.0000rem;height:50px;caret-color:var(--ios-tint)}
.field input::placeholder{color:var(--ios-label-2);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 14px;border-radius:var(--ios-r-chip);background:var(--ios-fill);color:var(--ios-label-2);font-size:0.8824rem;font-weight:600}
.chip.on{background:var(--ios-tint-wash);color:var(--ios-tint-strong);box-shadow:inset 0 0 0 1.5px var(--ios-tint)}
.full{font-size:0.8824rem;color:var(--ios-warn-ink);font-weight:600;line-height:1.35;margin-top:10px}
.stitle{font-size:1.2941rem;font-weight:700;letter-spacing:-.01em}
.smuted{font-size:0.8824rem;color:var(--ios-label-2);margin:4px 0 14px}
.srow{display:flex;gap:12px;align-items:center;min-height:56px;padding:0 14px;background:var(--ios-bg)}
.srow+.srow{border-top:1px solid var(--ios-separator)}
.srow .tt{flex:1}
.srow .src{display:block;font-size:0.7647rem;color:var(--ios-label-2)}
.ccard{border:1.5px solid var(--ios-separator);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--ios-bg);width:100%;display:block}
.ccard.sel{border:2px solid var(--ios-tint)}
.ccard .w{display:flex;gap:6px;align-items:center;font-size:0.7647rem;font-weight:600;color:var(--ios-label-2)}
.ccard .n{font-size:1.0000rem;font-weight:600;margin-top:4px}
.ccard .m{font-size:0.8824rem;color:var(--ios-label-2)}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{font-size:0.9412rem}
.menu .sec{padding-top:18px}
.mrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 var(--ios-cell-pad-x);width:100%;font-size:1.0000rem;background:var(--ios-cell)}
.mrow+.mrow{border-top:1px solid var(--ios-separator)}
.mrow .tt{flex:1}
.mrow .k{font-size:0.7647rem;color:var(--ios-label-2)}
.mrow.danger{color:var(--ios-warn-ink);font-weight:600}
.mrow .ok{color:var(--ios-tint)}

/* skeleton */
.skel{background:var(--ios-fill);border-radius:8px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--ios-bg),transparent);transform:translateX(-100%);animation:sh 1.4s infinite}
/* focus */
.eyebrow{font-size:0.7647rem;font-weight:600;letter-spacing:.06em;color:var(--ios-label-2);text-transform:uppercase}
.timer{font-family:ui-serif,"New York",var(--font-display);font-weight:600;font-size:4.4706rem;line-height:1.05;color:var(--ios-tint-strong);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.bar{height:6px;border-radius:3px;background:var(--ios-fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ios-tint);border-radius:3px;transition:width .4s linear}
.sill{margin:10px var(--ios-margin) 0;border-radius:16px;background:var(--ios-plant-card);position:relative;overflow:hidden;flex:0 1 300px;min-height:150px}
.sill .p{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(170px,52%)}
.sill .p img{width:100%;display:block}
.sill .ledge{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(var(--sill-top),var(--sill-bot))}
.chipmock{position:absolute;top:12px;right:12px;font-size:0.6765rem;font-weight:700;padding:3px 9px;border-radius:var(--ios-r-chip);background:var(--ios-warn-bg);color:var(--ios-warn-ink)}
.endtitle{font-family:ui-serif,"New York",var(--font-display);font-weight:600;font-size:2.1176rem;line-height:1.05;color:var(--ios-tint-strong)}
.endtitle.w{color:var(--ios-warn-ink)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 26px 0}
.coach{margin:10px 0 0;border:1.5px dashed var(--ios-label-2);border-radius:14px;padding:10px 12px;font-size:0.7941rem;color:var(--ios-label-2);line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.coach b{color:var(--ios-label);letter-spacing:.04em;font-size:0.6765rem;display:block;text-transform:uppercase}
.coach button{margin-left:auto;min-width:44px;min-height:44px;margin-top:-12px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--ios-label-2)}
.slidein{animation:slidein .32s var(--ios-sheet-ease) both}
.fakekb{position:absolute;left:0;right:0;bottom:0;height:var(--ios-keyboard-h);background:var(--ios-separator);z-index:65;display:grid;place-items:center;color:var(--ios-label-2);font-size:0.7647rem}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes slidein{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .skel::after{display:none}
}
:focus-visible{outline:2px solid var(--ios-tint);outline-offset:2px}
</style>

      '<div class="srow">' + ic('laptop', 20) + '<span class="tt">MacBook<span class="src">Same OneDrive file</span></span><span class="status" style="margin:0;padding:0;min-height:0">' + ic('check', 14) + '9:40 PM</span></div></div>' +
      '<button class="btn out" style="margin-top:14px" data-act="sync-now"' + (busy ? ' disabled' : '') + '>' + ic('sync', 18) + 'Sync now</button></div></div>';
  }
  if (sh.type === 'conflict') {
    return scrim + '<div class="sheet auto" role="dialog" aria-label="Edited on both devices"><div class="grab"></div><div class="inner"><h3 class="stitle">Edited on both devices</h3><p class="smuted" style="margin-bottom:0">Nothing is lost. Choose which version to keep.</p>' +
      '<div class="ccard"><div class="w">' + ic('laptop', 15) + 'On your Mac \u00b7 8:12 PM</div><div class="n">Read two papers</div><div class="m">Time box 45 min</div></div>' +
      '<div class="ccard sel"><div class="w">' + ic('phone', 15) + 'On this iPhone \u00b7 8:20 PM, made offline</div><div class="n">Read one paper</div><div class="m">Time box 30 min</div></div>' +
      '<div class="btnrow"><button class="btn out" data-act="keep-mac">Keep Mac version</button><button class="btn pri" data-act="keep-phone">Keep iPhone version</button></div>' +
      '<button class="btn txt" style="margin:2px auto 0;width:auto;padding:0 16px" data-act="decide-later">Decide later</button></div></div>';
  }
  if (sh.type === 'giveup') {
    return scrim + '<div class="sheet auto" role="alertdialog" aria-label="Give up"><div class="grab"></div><div class="inner"><h3 class="stitle">Give up this session?</h3><p class="smuted">The plant will wither. Only Give up does that. The minutes before now are not counted.</p>' +
      '<button class="btn out giveup" data-act="giveup-yes">Give up</button><button class="btn pri" style="margin-top:10px" data-act="sheet-close">Keep going</button></div></div>';
  }
  if (sh.type === 'menu') {
    var R = function (k, label, hint, on) { return '<button class="mrow" data-act="scn" data-k="' + k + '"><span class="tt">' + label + '</span>' + (hint ? '<span class="k">' + hint + '</span>' : '') + (on ? '<span class="ok">' + ic('check', 18, 2.4) + '</span>' : '') + '</button>'; };
    var cur = T.scn;
    return scrim + '<div class="sheet menu" role="dialog" aria-label="Demo states"><div class="grab"></div><div class="shead"><span class="l" style="visibility:hidden">x</span><b>Demo states</b><button class="r" data-act="sheet-close">Done</button></div><div class="inner" style="padding-bottom:calc(var(--ios-safe-bottom) + 16px)">' +
      '<p class="hint" style="padding-top:0">Prototype only. These switch the screen into each state for review. Data here is fake.</p>' +
      '<div class="sec">Flows</div><div class="grp">' + R('parked', 'Parked sequence', 'guided') + R('six', '6 goals (limit)', '') + R('midnight', 'Session past midnight IST', '', cur === 'midnight') + R('newday', 'New day, fresh list', '', cur === 'newday') + '</div>' +
      '<div class="sec">First run, loading, error</div><div class="grp">' + R('firstrun', 'First run (sign-in, mocked)', '', cur === 'firstrun') + R('empty', 'Empty today', '', cur === 'empty') + R('loading', 'Loading', '', cur === 'loading') + R('error', 'Error with Try again', '', cur === 'error') + '</div>' +
      '<div class="sec">Sync</div><div class="grp">' + R('offline', 'Offline', '', cur === 'offline') + R('syncing', 'Syncing', '', cur === 'syncing') + R('queued', '2 changes waiting to upload', '', cur === 'queued') + R('waiting', 'Waiting for your Mac', '', cur === 'waiting') +
      R('macupdate', 'Mac needs update', '', cur === 'macupdate') + R('syncheld', 'syncHeld', '', cur === 'syncheld') + R('failed', 'Sync failed', '', cur === 'failed') + R('conflict', 'Edited on both devices', '', cur === 'conflict') + R('expired', 'Sign-in expired', '', cur === 'expired') +
      R('clock', 'Phone clock is off', '', cur === 'clock') + R('tz', 'Days follow India time', '', cur === 'tz') + '</div>' +
      '<div class="sec">Reset</div><div class="grp">' + R('normal', 'Back to normal', '', !cur) + '<button class="mrow danger" data-act="reset"><span class="tt">Reset demo</span></button></div></div></div>';
  }
  return '';
}
function renderLayer() {
  var L = $('#layer'); L.innerHTML = sheetHTML();
  document.getElementById('device').style.setProperty('--kb', (T.sheet && T.sheet.type === 'add' ? (FAKEKB ? 336 : T.kb) : 0) + 'px');
  if (T.sheet && T.sheet.type === 'add' && FAKEKB) L.insertAdjacentHTML('beforeend', '<div class="fakekb" aria-hidden="true">keyboard (test fixture)</div>');
}

/* ---------- render ---------- */
function render() {
  var sc = T.scn, h;
  if (sc === 'firstrun') h = viewFirstRun();
  else if (sc === 'loading') h = viewLoading();
  else if (sc === 'error') h = viewError();
  else if (sc === 'midnight') h = midnightView();
  else if (S.end && S.tab === 'focus') h = endView();
  else if (S.tab === 'focus') h = viewFocus();
  else h = viewToday();
  var scr = $('#app .scroll'), top = scr ? scr.scrollTop : 0;
  $('#app').innerHTML = h;
  scr = $('#app .scroll'); if (scr) scr.scrollTop = top;
  if (T.auto && scr) { scr.scrollTop = scr.scrollHeight; T.auto = false; }
  var t = sc === 'tz' ? '5:11' : (sc === 'midnight' || sc === 'newday') ? '12:30' : '9:41';
  $('#simsb').innerHTML = '<span>' + t + '</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/></svg></span>';
  save();
}
function rerenderAll() { render(); renderLayer(); }

/* ---------- actions ---------- */
function findGoal(id) { return list().filter(function (g) { return g.id === id; })[0]; }
function openSheet(type) { T.sheet = { type: type }; renderLayer(); if (type === 'add') { var i = $('#gtitle'); if (viewGoals().length >= 6) { var m = $('#addmsg'); if (m) m.hidden = false; if (i) { i.disabled = true; } } else if (i) i.focus(); } }
function closeSheet() { T.sheet = null; renderLayer(); }
function toast() {}
var box = 0;
function commitAdd() {
  var i = $('#gtitle'); if (!i) return; var title = i.value.trim(); if (!title) return;
  if (viewGoals().length >= 6) { var m = $('#addmsg'); if (m) { m.hidden = false; } return; }
  list().push(G(title, box || null, 0, { id: S.nextId++, unsynced: offlineNow() }));
  T.removed = null; T.movedIn = false; closeSheet(); render();
}
function startSync() {
  T.sheet = null; renderLayer(); T.syncing = true; render();
  setTimeout(function () {
    T.syncing = false; var sc = T.scn;
    if (S.seq === 1) { parkMove(); T.auto = true; }
    if (sc === 'queued' || sc === 'waiting' || sc === 'failed' || sc === 'syncing' || !sc) { T.scn = null; S.goals.forEach(function (g) { g.unsynced = false; g.waiting = false; }); S.sync = 'ok'; }
    render();
  }, 1300);
}
function parkMove() {
  var late = S.goals.filter(function (g) { return g.title === 'Call the bank'; })[0];
  S.goals = S.goals.filter(function (g) { return g !== late; }); S.goals.forEach(function (g) { g.unsynced = false; g.waiting = false; });
  var mac = G('Morning pages', 15, 0, { id: S.nextId++ });
  var at = S.goals.findIndex(function (g) { return g.title === 'Deep work on the stack'; }); if (at < 0) at = S.goals.length;
  S.goals.splice(at, 0, mac);
  var pid = S.nextId++; S.parked = [{ id: pid, title: 'Call the bank' }]; T.justParked = pid; S.seq = 2; S.sync = 'ok';
}
function endSession(kind) {
  var s = S.session; if (!s) return;
  var now = Date.now(), el = Math.min(now - s.startedAt, s.dur * 60000), kept = Math.floor(el / 60000);
  var g = S.goals.filter(function (x) { return x.id === s.goalId; })[0];
  if (kind === 'grew') {
    if (g) { g.mins += s.dur; if (offlineNow()) g.unsynced = true; }
    S.plants += 1; S.mins += s.dur;
  }
  S.end = { kind: kind, title: s.title, dur: s.dur, kept: kept, started: clock12(s.startedAt), ended: clock12(kind === 'grew' ? s.startedAt + s.dur * 60000 : now) };
  S.session = null; S.tab = 'focus'; T.sheet = null; render(); renderLayer();
}
function tickSession() {
  if (!S.session) return;
  if (remaining() <= 0) { endSession('grew'); return; }
  var r = remaining(), p = 1 - r / (S.session.dur * 60000);
  var tm = $('#tm'); if (tm) tm.textContent = mmss(r);
  var rt = $('#runt'); if (rt) rt.textContent = mmss(r);
  var pb = $('#pb'); if (pb) pb.style.width = Math.round(p * 100) + '%';
  var sp = $('#spl'); if (sp) { var st = stageFor(p); var img = sp.querySelector('img'); if (img && img.alt.indexOf(st) < 0) sp.innerHTML = plant(st); }
}
function scn(k) {
  T.sheet = null; T.removed = null; T.movedIn = false; T.conflict = null; T.alt = null;
  if (k === 'normal') { T.scn = null; S.goals.forEach(function (g) { g.unsynced = false; g.waiting = false; }); if (S.seq !== 1) S.sync = 'ok'; }
  else if (k === 'parked') { startParked(); T.scn = null; S.tab = 'today'; }
  else if (k === 'six') { sixGoals(); T.scn = null; S.tab = 'today'; }
  else if (k === 'empty') { T.alt = { goals: [] }; T.scn = 'empty'; S.tab = 'today'; }
  else if (k === 'newday') { T.alt = { goals: [] }; T.scn = 'newday'; S.tab = 'today'; }
  else { T.scn = k; if (k !== 'midnight' && k !== 'firstrun' && k !== 'loading' && k !== 'error') S.tab = 'today'; if (k === 'midnight') S.tab = 'focus'; }
  if (k === 'syncing') { T.sheet = { type: 'sync' }; }
  if (k === 'conflict') { T.sheet = { type: 'conflict' }; }
  rerenderAll();
}
function startParked() {
  S.goals = [G('Write the weekly review', 45, 30, { id: 1 }), G('Read one paper', 30, 30, { id: 2 }), G('Gym', null, 0, { id: 3 }), G('Plan Friday' + AP + 's demo', 25, 0, { id: 4 }),
    G('Deep work on the stack', 60, 20, { id: 5 }), G('Call the bank', null, 0, { id: 6, unsynced: true })];
  S.goals[1].unsynced = true;
  S.parked = []; S.seq = 1; S.coachOff = false; S.sync = 'queued'; S.nextId = 20;
}
function sixGoals() {
  var base = fresh().goals; S.goals = base.concat([G('Morning pages', 15, 15, { id: 5 }), G('Deep work on the stack', 60, 20, { id: 6 })]); S.parked = []; S.seq = 0;
}
function reset() { S = fresh(); T.scn = null; T.sheet = null; T.alt = null; T.removed = null; T.movedIn = false; T.conflict = null; T.pick = null; T.dur = 50; try { localStorage.removeItem(LS); } catch (e) {} rerenderAll(); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), id = Number(el.getAttribute('data-id'));
  if (swipeMoved) { swipeMoved = false; if (a !== 'remove') return; }
  switch (a) {
    case 'tab': S.tab = el.getAttribute('data-tab'); render(); break;
    case 'add': openSheet('add'); box = 0; break;
    case 'sheet-close': closeSheet(); break;
    case 'add-commit': commitAdd(); break;
    case 'box': box = Number(el.getAttribute('data-b')); [].forEach.call(document.querySelectorAll('.chips .chip'), function (c) { var on = c === el; c.classList.toggle('on', on); c.setAttribute('aria-checked', on); }); $('#tbval').textContent = box ? box + ' min' : 'No time box'; break;
    case 'open-focus': { T.pick = id; S.tab = 'focus'; T.sheet = null; render(); break; }
    case 'remove': { var arr = list(), i = arr.findIndex(function (x) { return x.id === id; }); if (i >= 0) { T.removed = { g: arr[i], i: i }; arr.splice(i, 1); T.movedIn = false; if (S.parked.length) T.auto = true; render(); } break; }
    case 'undo': if (T.removed) { list().splice(T.removed.i, 0, T.removed.g); T.removed = null; render(); } break;
    case 'movein': { if (list().length >= 6) return; var p = S.parked.filter(function (x) { return x.id === id; })[0]; if (p) { list().push(G(p.title, null, 0, { id: S.nextId++ })); S.parked = S.parked.filter(function (x) { return x !== p; }); S.seq = Math.max(S.seq, 4); T.movedIn = true; T.removed = null; T.auto = true; render(); } break; }
    case 'coach-off': S.coachOff = true; render(); break;
    case 'syncsheet': openSheet('sync'); break;
    case 'sync-now': startSync(); break;
    case 'retrysync': startSync(); break;
    case 'signin-again': T.scn = null; render(); break;
    case 'conflict-open': openSheet('conflict'); break;
    case 'keep-mac': { var g1 = S.goals[1]; if (g1) { g1.title = MAC_V.title; g1.box = MAC_V.box; } T.conflict = 'done'; T.scn = null; closeSheet(); render(); break; }
    case 'keep-phone': T.conflict = 'done'; T.scn = null; closeSheet(); render(); break;
    case 'decide-later': T.conflict = 'later'; T.scn = null; closeSheet(); render(); break;
    case 'menu': openSheet('menu'); break;
    case 'scn': scn(el.getAttribute('data-k')); break;
    case 'reset': reset(); break;
    case 'start-pick': S.tab = 'focus'; T.pick = null; render(); break;
    case 'pick': T.pick = id; render(); break;
    case 'dur': T.dur = Number(el.getAttribute('data-d')); render(); break;
    case 'begin': { var gg = findGoal(T.pick); if (!gg) return; S.session = { goalId: gg.id, title: gg.title, dur: T.dur, startedAt: Date.now() }; S.end = null; render(); break; }
    case 'giveup': openSheet('giveup'); break;
    case 'giveup-yes': endSession('withered'); break;
    case 'go-today': S.end = null; S.tab = 'today'; render(); break;
    case 'try-again': S.end = null; S.tab = 'focus'; render(); break;
    case 'go-newday': T.alt = { goals: [] }; T.scn = 'newday'; S.tab = 'today'; render(); break;
    case 'firstrun-go': T.scn = null; S.tab = 'today'; render(); break;
    case 'retry-load': T.scn = 'loading'; render(); setTimeout(function () { if (T.scn === 'loading') { T.scn = null; render(); } }, 900); break;
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'gtitle') { var b = $('#addbtn'); if (b) b.disabled = !e.target.value.trim(); var m = $('#addmsg'); if (m && !m.hidden && viewGoals().length < 6) m.hidden = true; }
});
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'gtitle' && e.key === 'Enter') { e.preventDefault(); commitAdd(); }
  if (e.key === 'Escape' && T.sheet) closeSheet();
});

/* swipe left to remove */
var swipeMoved = false, sw = null;
document.addEventListener('pointerdown', function (e) {
  var r = e.target.closest('.swipe .row'); if (!r) return;
  sw = { r: r, x: e.clientX, y: e.clientY, base: r.classList.contains('open') ? -96 : 0, dx: 0, lock: null };
});
document.addEventListener('pointermove', function (e) {
  if (!sw) return; var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (sw.lock == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (sw.lock !== 'x') return; swipeMoved = true; sw.r.classList.add('drag');
  sw.dx = Math.max(-96, Math.min(0, sw.base + dx)); sw.r.style.transform = 'translateX(' + sw.dx + 'px)';
});
function swEnd() { if (!sw) return; var r = sw.r; r.classList.remove('drag'); if (sw.lock === 'x') { var open = sw.dx < -48; r.classList.toggle('open', open); r.style.transform = open ? 'translateX(-96px)' : ''; setTimeout(function () { swipeMoved = false; }, 60); } sw = null; }
document.addEventListener('pointerup', swEnd); document.addEventListener('pointercancel', swEnd);
document.addEventListener('click', function (e) { if (!e.target.closest('.swipe')) [].forEach.call(document.querySelectorAll('.swipe .row.open'), function (r) { r.classList.remove('open'); r.style.transform = ''; }); }, true);

/* keyboard: keep the add sheet above the iOS keyboard */
if (window.visualViewport) {
  var onVV = function () { var vv = window.visualViewport; T.kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); if (T.sheet && T.sheet.type === 'add' && !FAKEKB) document.getElementById('device').style.setProperty('--kb', T.kb + 'px'); if (vv.offsetTop) window.scrollTo(0, 0); };
  window.visualViewport.addEventListener('resize', onVV); window.visualViewport.addEventListener('scroll', onVV);
}

/* simulated device on wide screens or ?frame=1 */
var wide = !window.matchMedia('(max-width:500px)').matches;
document.documentElement.classList.toggle('sim', wide || q.has('frame'));
document.documentElement.classList.toggle('wide', wide);
function fit() { if (!wide) return; var s = Math.min(1, (window.innerHeight - 24) / 844); document.getElementById('device').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();

setInterval(tickSession, 250);
document.addEventListener('visibilitychange', tickSession); window.addEventListener('pageshow', tickSession); window.addEventListener('focus', tickSession);
if (q.get('scn')) { var k = q.get('scn'); if (k === 'parked' || k === 'six' || k === 'normal') scn(k); else { scn(k); } }
rerenderAll();
tickSession();
window.__cadence = { S: function () { return S; }, T: function () { return T; }, scn: scn };
})();
